[package]
name = "phantom"
version = "0.1.0"
edition = "2021"
authors = ["PHANTOM Security Team"]
description = "Stealth traffic masquerading framework for authorized penetration testing"
license = "MIT"
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"

# Networking
pnet = "0.34"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
trust-dns-resolver = "0.23"
trust-dns-proto = "0.23"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Timing and randomness
rand = "0.8"
rand_distr = "0.4"
tokio-util = { version = "0.7", features = ["time"] }

# Async traits
async-trait = "0.1"

# Encoding
base32 = "0.4"
md5 = "0.7"

# TUI (optional)
ratatui = { version = "0.26", optional = true }
crossterm = { version = "0.27", optional = true }

# Crypto for tunneling
base64 = "0.22"
rustls = "0.23"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
blake2 = "0.10"
hkdf = "0.12"
hex = "0.4"

# Byte manipulation
bytes = "1.5"
dialoguer = "0.12.0"
sha2 = "0.11.0"
dashmap = "6.2.1"
hmac = "0.13.0"
proptest = "1.11.0"
chromiumoxide = { version = "0.9.1", optional = true }
governor = "0.10.4"
aya = "0.13"
aya-log = "0.2"
[features]
default = ["tui"]
tui = ["ratatui", "crossterm"]
chromium_capture = ["chromiumoxide"]
fuzz = []

[profile.release]
opt-level = 3
lto = false
strip = true
panic = "abort"

[[bin]]
name = "phantom"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.27", features = ["net", "ioctl"] }

[workspace]
members = ["netprobe-ebpf"]
